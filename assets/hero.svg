<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Samandar Eshpulatov</title>
  <desc id="desc">Flutter developer in Tashkent. Vault pass for Hazina, EduFlix, UzNext.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6E2B0"/>
      <stop offset="38%" stop-color="#C9A15A"/>
      <stop offset="72%" stop-color="#8C6A2F"/>
      <stop offset="100%" stop-color="#E8C77A"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C77A" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#C9A15A" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="spot" cx="78%" cy="42%" r="42%">
      <stop offset="0%" stop-color="#3A2A14"/>
      <stop offset="55%" stop-color="#120F0C"/>
      <stop offset="100%" stop-color="#070605"/>
    </radialGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A140C"/>
      <stop offset="50%" stop-color="#2A2114"/>
      <stop offset="100%" stop-color="#1A140C"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="460" fill="url(#spot)"/>
  <rect width="1200" height="460" filter="url(#grain)" opacity=".55"/>

  <!-- certificate frame -->
  <rect x="18" y="18" width="1164" height="424" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity=".85"/>
  <rect x="26" y="26" width="1148" height="408" fill="none" stroke="#C9A15A" stroke-width=".4" opacity=".35"/>
  <!-- corner ticks -->
  <g stroke="url(#gold)" stroke-width="1.4" fill="none">
    <path d="M18 48 V18 H48"/>
    <path d="M1182 48 V18 H1152"/>
    <path d="M18 412 V442 H48"/>
    <path d="M1182 412 V442 H1152"/>
  </g>

  <!-- left serial -->
  <g fill="#C9A15A" font-family="Georgia, 'Times New Roman', serif" letter-spacing="4">
    <text x="52" y="64" font-size="11" opacity=".75">PASS  SE07  ·  TASHKENT  41.3°N</text>
  </g>
  <g fill="#E8D5A3" font-family="Georgia, 'Times New Roman', serif">
    <text x="52" y="168" font-size="18" letter-spacing="8" opacity=".55">FLUTTER  DEVELOPER</text>
    <text x="50" y="232" font-size="54" letter-spacing="3">SAMANDAR</text>
    <text x="52" y="288" font-size="54" letter-spacing="10" fill="url(#gold)">ESHPULATOV</text>
    <text x="52" y="328" font-size="14" letter-spacing="3" fill="#C9A15A" opacity=".8">Ships products. Not demos.</text>
  </g>

  <!-- vault dial -->
  <g transform="translate(980 230)">
    <circle r="128" fill="none" stroke="#C9A15A" stroke-width=".4" opacity=".25"/>
    <circle r="108" fill="none" stroke="url(#gold)" stroke-width="1.1" opacity=".7"/>
    <circle r="88" fill="none" stroke="#C9A15A" stroke-width=".5" stroke-dasharray="4 7" opacity=".55">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle r="62" fill="none" stroke="url(#gold)" stroke-width="1.6" stroke-dasharray="38 14 8 14" opacity=".9">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="28" fill="#1A140C" stroke="url(#gold)" stroke-width="1.2"/>
    <circle r="8" fill="url(#gold)" filter="url(#glow)"/>
    <g fill="#C9A15A" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="3">
      <text text-anchor="middle" y="4">SE</text>
    </g>
    <!-- ticks -->
    <g stroke="#C9A15A" stroke-width="1" opacity=".45">
      <path d="M0 -108 V-98"/>
      <path d="M0 98 V108"/>
      <path d="M-108 0 H-98"/>
      <path d="M98 0 H108"/>
    </g>
  </g>

  <!-- scan line -->
  <rect x="26" y="26" width="1148" height="2" fill="url(#goldSoft)" opacity=".35">
    <animate attributeName="y" values="26;430;26" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".05;.45;.05" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- magnetic stripe -->
  <rect x="26" y="368" width="1148" height="66" fill="url(#stripe)"/>
  <g fill="#E8C77A" font-family="Georgia, 'Times New Roman', serif" font-size="13" letter-spacing="5">
    <text x="52" y="396">HAZINA</text>
    <text x="220" y="396">EDUFLIX</text>
    <text x="400" y="396">UZNEXT</text>
    <text x="52" y="418" font-size="11" letter-spacing="3" opacity=".65">PLAY MARKET  ·  EDUFLIX.UZ  ·  UZNEXT.UZ</text>
  </g>
  <g fill="#C9A15A" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3">
    <text x="980" y="408" text-anchor="end" opacity=".8">OPEN TO WORK  ·  TASHKENT</text>
  </g>
</svg>
